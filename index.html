<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>旅遊收支記帳管家 - 主程式</title>
    <!-- 正式環境建議改用 PostCSS，此處為開發測試用 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f3f4f6; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .receipt-preview { max-width: 100px; max-height: 100px; cursor: pointer; border-radius: 8px; object-fit: cover; border: 1px solid #e2e8f0; }
        .card-hover { transition: all 0.2s ease; }
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1); }
        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.5); backdrop-filter: blur(2px); }
        .modal-content { background-color: white; margin: 5% auto; padding: 24px; border-radius: 16px; width: 90%; max-width: 650px; max-height: 85vh; overflow-y: auto; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1); }
        .animate-fade-in { animation: fadeIn 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
        .config-cols { display: flex; gap: 16px; height: 320px; }
        .config-col { flex: 1; display: flex; flex-direction: column; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; background: white; }
        .config-col-header { background-color: #f8fafc; padding: 10px 16px; border-bottom: 1px solid #e2e8f0; font-weight: 600; font-size: 0.9rem; display: flex; justify-content: space-between; }
        .config-col-body { flex: 1; overflow-y: auto; padding: 8px; }
        .tag-editable { display: flex; align-items: center; justify-content: space-between; background-color: white; border: 1px solid #e2e8f0; border-radius: 8px; padding: 6px 10px; margin-bottom: 6px; cursor: pointer; }
        .tag-editable.selected { background-color: #eff6ff; border-color: #2563eb; }
        .tag-actions { display: flex; gap: 4px; opacity: 0.4; }
        .tag-editable:hover .tag-actions { opacity: 1; }
        .tag-btn-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; border-radius: 4px; }
        .tag-btn-icon:hover { background-color: #e2e8f0; }
        .hierarchical-select { width: 100%; padding: 10px 12px; border: 1px solid #cbd5e1; border-radius: 8px; background-color: white; }
        .ledger-stats-bar { display: flex; gap: 1px; background: #e2e8f0; border-radius: 8px; overflow: hidden; margin-top: 12px; }
        .stat-item { flex: 1; background: white; padding: 10px; text-align: center; }
        .stat-item .label { font-size: 0.7rem; color: #64748b; font-weight: 700; }
        .stat-item .value { font-size: 1.1rem; font-weight: 700; }
        .treat-badge { background-color: #fce7f3; color: #db2777; font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; }
        #expenseModal .modal-header-close { display: none; }
        option:disabled { color: #64748b; background-color: #f1f5f9; font-weight: bold; }
        .settle-checkbox { width: 18px; height: 18px; cursor: pointer; margin-left: 8px; }
    </style>
</head>
<body class="bg-gray-50 text-slate-800">
    <nav class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="container mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white p-2 rounded-lg shadow-md"><i class="fas fa-plane-departure text-xl"></i></div>
                <div><h1 class="text-xl font-bold text-slate-800">旅遊記帳管家</h1><span id="versionTag" class="text-xs text-slate-500 font-mono"></span></div>
            </div>
            <div class="flex items-center gap-3">
                <div id="firebaseStatus" class="text-xs px-2 py-1 rounded-full bg-red-100 text-red-600 flex items-center gap-1"><i class="fas fa-plug"></i> <span>連線中...</span></div>
                <button id="viewStatsBtn" class="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-lg text-sm font-medium hover:bg-indigo-100 transition flex items-center gap-2"><i class="fas fa-chart-pie"></i> 檢視統計</button>
                <div id="userBtn" class="w-9 h-9 flex items-center justify-center rounded-full cursor-pointer bg-slate-100 relative"><i class="fas fa-user"></i><div id="userStatusDot" class="absolute -bottom-1 -right-1 w-3 h-3 bg-red-400 rounded-full border-2 border-white"></div></div>
                <div id="aboutBtn" class="w-9 h-9 flex items-center justify-center rounded-full cursor-pointer bg-slate-100"><i class="fas fa-info"></i></div>
            </div>
        </div>
    </nav>

    <main class="container mx-auto px-4 py-6 max-w-5xl">
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 mb-6 overflow-hidden">
            <div id="ledgerToggleHeader" class="p-5 flex justify-between items-center cursor-pointer">
                <div><h2 id="displayLedgerName" class="text-lg font-bold text-slate-800">請選擇或建立帳冊</h2><div id="ledgerMetaSummary" class="text-xs text-slate-500 hidden"></div></div>
                <div><span id="lockBadge" class="hidden px-2 py-0.5 rounded text-xs bg-red-100 text-red-600"><i class="fas fa-lock mr-1"></i>已鎖定</span><i id="ledgerChevron" class="fas fa-chevron-down text-slate-400 ml-3"></i></div>
            </div>
            <div id="ledgerCollapsible" class="transition-all duration-300 overflow-hidden" style="max-height: 500px;">
                <div class="p-5 pt-0 border-t">
                    <div class="mt-4 flex flex-wrap gap-4 items-center">
                        <select id="ledgerSelect" class="border rounded-lg px-4 py-2.5 w-64"><option value="">請選擇帳冊</option></select>
                        <button id="addLedgerBtn" class="bg-blue-600 text-white px-4 py-2.5 rounded-lg"><i class="fas fa-plus"></i> 新增</button>
                        <button id="editLedgerBtn" class="bg-white border px-4 py-2.5 rounded-lg"><i class="fas fa-sliders-h"></i> 設定</button>
                        <div id="adminControls" class="hidden flex gap-2">
                            <button id="toggleLockLedgerBtn" class="text-amber-600"><i class="fas fa-lock"></i></button>
                            <button id="deleteLedgerBtn" class="text-red-600"><i class="fas fa-trash-alt"></i></button>
                        </div>
                    </div>
                    <div id="ledgerInfo" class="hidden mt-4 bg-slate-50 p-4 rounded-xl">
                        <div class="grid grid-cols-3 gap-4 text-sm"><div><div class="text-slate-400 text-xs">科目</div><span id="ledgerCategories"></span></div><div><div class="text-slate-400 text-xs">地點</div><span id="ledgerLocations"></span></div><div><div class="text-slate-400 text-xs">成員</div><span id="ledgerMembers"></span></div></div>
                        <div class="ledger-stats-bar"><div class="stat-item treat"><div class="label">請客</div><div id="statWaived">0</div></div><div class="stat-item settled"><div class="label">已結</div><div id="statSettled">0</div></div><div class="stat-item outstanding"><div class="label">未結</div><div id="statOutstanding">0</div></div><div class="stat-item"><div class="label">總額</div><div id="statTotal">0</div></div></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6">
            <div class="flex justify-between items-center mb-6"><h3 class="font-bold text-lg">支出明細</h3><button id="addExpenseBtn" class="bg-green-600 text-white px-5 py-2.5 rounded-lg"><i class="fas fa-plus"></i> 記一筆</button></div>
            <div id="expenseList" class="space-y-4 max-h-[600px] overflow-y-auto"></div>
        </div>
    </main>

    <div id="aboutModal" class="modal"><div class="modal-content"><div class="flex justify-between"><h3 class="text-xl font-bold">關於</h3><button class="closeModal"><i class="fas fa-times"></i></button></div><div id="qrcodeContainer" class="flex justify-center my-4"></div><p class="text-center text-sm">旅遊收支記帳管家 Pro<br>版本 <span id="aboutVersion"></span></p></div></div>
    
    <!-- 使用者設定 Modal - 改良顯示目前登入者 -->
    <div id="userProfileModal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h3 id="userModalTitle" class="text-xl font-bold text-slate-800">使用者設定</h3>
                <button class="closeModal text-slate-400 hover:text-slate-600"><i class="fas fa-times text-xl"></i></button>
            </div>
            <div id="currentUserInfo" class="mb-4 p-3 bg-slate-50 rounded-lg hidden">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center"><i class="fas fa-user-circle text-xl"></i></div>
                    <div>
                        <div class="font-bold" id="currentUserName"></div>
                        <div class="text-xs text-slate-500" id="currentUserEmail"></div>
                    </div>
                </div>
            </div>
            <form id="userForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">顯示名稱 (暱稱)</label>
                    <input type="text" id="inputUserName" required class="w-full border rounded p-2" placeholder="例如：小明">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">Google Email</label>
                    <input type="email" id="inputUserEmail" required class="w-full border rounded p-2" placeholder="example@gmail.com">
                </div>
                <div id="adminBadgeContainer" class="hidden text-center">
                    <span class="bg-green-100 text-green-700 text-xs px-3 py-1 rounded-full"><i class="fas fa-shield-alt mr-1"></i> 系統管理員</span>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">更新資料</button>
                    <button type="button" id="switchUserBtn" class="border border-slate-300 text-slate-600 px-4 py-2 rounded hover:bg-slate-50">切換使用者</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="ledgerModal" class="modal">
        <div class="modal-content">
            <h3 id="ledgerModalTitle" class="text-xl font-bold mb-4">新增帳冊</h3>
            <form id="ledgerForm">
                <input type="text" id="ledgerName" placeholder="帳冊名稱" required class="w-full border rounded p-2 mb-4">
                <div id="configArea"></div>
                <div class="flex justify-end gap-2 mt-4">
                    <button type="button" class="closeModal bg-white border px-4 py-2 rounded">取消</button>
                    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">儲存</button>
                </div>
            </form>
        </div>
    </div>
    
    <div id="expenseModal" class="modal" data-backdrop="static">
        <div class="modal-content animate-fade-in">
            <h3 id="expenseModalTitle" class="text-xl font-bold mb-4">新增支出</h3>
            <div id="lockedMessage" class="hidden mb-4 p-3 bg-red-50 text-red-600 border border-red-200 rounded-lg text-sm"><i class="fas fa-lock"></i> 帳冊已鎖定，您僅有檢視權限。</div>
            <form id="expenseForm">
                <fieldset id="expenseFieldset">
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <input type="date" id="expenseDate" required class="border rounded p-2">
                        <input type="time" id="expenseTime" required class="border rounded p-2">
                    </div>
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <select id="expenseCategory" required class="border rounded p-2"></select>
                        <select id="expenseLocation" required class="border rounded p-2"></select>
                    </div>
                    <div id="destinationWrapper" class="hidden mb-4">
                        <label class="block text-sm font-medium text-slate-600 mb-1">目的地點</label>
                        <select id="expenseDestination" class="border rounded p-2 w-full"></select>
                    </div>
                    <input type="text" id="expenseDescription" placeholder="摘要" required class="w-full border rounded p-2 mb-4">
                    <div class="relative mb-4">
                        <span class="absolute left-3 top-2 text-slate-400">$</span>
                        <input type="number" id="expenseAmount" step="0.01" placeholder="金額" required class="w-full border rounded pl-8 p-2">
                    </div>
                    <select id="expensePayer" required class="w-full border rounded p-2 mb-4"></select>
                    <div class="mb-4 p-3 bg-slate-50 rounded-lg">
                        <div class="font-medium text-sm mb-2">分攤人員與付款狀態</div>
                        <div id="expenseSplitters" class="space-y-2 mb-2"></div>
                        <div class="text-right text-sm">每人平均：<span id="averageAmount" class="font-bold text-blue-600">0.00</span></div>
                    </div>
                    <div class="flex gap-4 mb-4">
                        <label class="flex items-center gap-1"><input type="checkbox" id="expenseTreat"> 金主請客</label>
                    </div>
                    <input type="file" id="expenseReceipt" accept="image/*" class="mb-4">
                    <div id="receiptPreview" class="hidden mb-4"><img id="receiptImagePreview" class="receipt-preview"></div>
                    <div class="flex justify-end gap-3 pt-2">
                        <button type="button" id="cancelExpenseBtn" class="bg-white border border-slate-300 text-slate-700 px-6 py-2 rounded-lg">取消</button>
                        <button type="submit" class="bg-blue-600 text-white px-6 py-2 rounded-lg shadow-md">儲存記錄</button>
                    </div>
                </fieldset>
            </form>
        </div>
    </div>
    
    <div id="receiptViewModal" class="modal"><div class="modal-content p-0 bg-black/80 text-center"><img id="receiptViewImage" class="max-w-full max-h-[80vh] mx-auto"><button class="closeModal absolute top-2 right-2 text-white text-2xl">&times;</button></div></div>
    <div id="toast" class="fixed bottom-6 right-6 bg-slate-800 text-white px-6 py-3 rounded-lg hidden z-50"></div>

    <script>
        const CURRENT_VERSION = 'v20260602.001';
        const APP_ADMIN_EMAIL = 'jumper.hsu@gmail.com';
        const firebaseConfig = {
            apiKey: "AIzaSyBpnGdgoel-wn9jyoHjkQJKJ7c7qRbbSvk",
            authDomain: "travelexpense-fcc89.firebaseapp.com",
            databaseURL: "https://travelexpense-fcc89-default-rtdb.firebaseio.com",
            projectId: "travelexpense-fcc89",
            storageBucket: "travelexpense-fcc89.firebasestorage.app",
            messagingSenderId: "77168421477",
            appId: "1:77168421477:web:c8f123a416c81197b1348c"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        
        let appData = { ledgers: [], currentLedgerId: null, expenses: [] };
        let currentUser = null;
        let currentEditingExpenseId = null;
        let skipAutoSummary = false;
        let tempLedger = { mainCats: [], subCats: {}, cities: [], districts: {}, members: [] };
        let selectedMainCatId = null, selectedCityId = null;
        let isFirebaseConnected = false;

        function isTransportByMainCat(mainName) {
            return mainName && mainName.includes('交通');
        }

        function upgradeOldExpense(exp) {
            if(exp.splitterSettled === undefined && exp.splitters) {
                const isSettled = exp.isSettled === true;
                const splitterSettled = {};
                exp.splitters.forEach(s => { splitterSettled[s] = isSettled; });
                exp.splitterSettled = splitterSettled;
                delete exp.isSettled;
            }
            return exp;
        }

        function loadLocalData() {
            const saved = localStorage.getItem('travelAccountingApp');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    appData = {
                        ledgers: Array.isArray(parsed.ledgers) ? parsed.ledgers : [],
                        currentLedgerId: parsed.currentLedgerId || null,
                        expenses: (Array.isArray(parsed.expenses) ? parsed.expenses : []).map(upgradeOldExpense)
                    };
                } catch(e) {
                    console.error("JSON parse error", e);
                    appData = { ledgers: [], currentLedgerId: null, expenses: [] };
                }
            }
            if (appData.currentLedgerId && !appData.ledgers.find(l => l.id === appData.currentLedgerId)) {
                appData.currentLedgerId = null;
            }
        }
        function saveData() {
            localStorage.setItem('travelAccountingApp', JSON.stringify(appData));
            if(isFirebaseConnected) {
                db.ref('travel_data').set(appData).catch(e => console.error("Firebase save error", e));
            }
        }
        function setupFirebaseSync() {
            const statusEl = document.getElementById('firebaseStatus');
            db.ref('.info/connected').on('value', (snap) => {
                if (snap.val() === true) {
                    isFirebaseConnected = true;
                    statusEl.innerHTML = '<i class="fas fa-check-circle"></i> <span>已連線</span>';
                    statusEl.classList.remove('bg-red-100', 'text-red-600');
                    statusEl.classList.add('bg-green-100', 'text-green-600');
                } else {
                    isFirebaseConnected = false;
                    statusEl.innerHTML = '<i class="fas fa-exclamation-triangle"></i> <span>離線模式</span>';
                    statusEl.classList.remove('bg-green-100', 'text-green-600');
                    statusEl.classList.add('bg-yellow-100', 'text-yellow-600');
                    showToast('Firebase 連線失敗，資料僅儲存於本機');
                }
            });

            db.ref('travel_data').on('value', (snap) => {
                if (snap.val()) {
                    const remote = snap.val();
                    const newAppData = {
                        ledgers: Array.isArray(remote.ledgers) ? remote.ledgers : [],
                        currentLedgerId: remote.currentLedgerId || null,
                        expenses: (Array.isArray(remote.expenses) ? remote.expenses : []).map(upgradeOldExpense)
                    };
                    if(JSON.stringify(appData) !== JSON.stringify(newAppData)) {
                        appData = newAppData;
                        localStorage.setItem('travelAccountingApp', JSON.stringify(appData));
                        updateUI();
                        showToast('雲端資料已同步');
                    }
                } else {
                    if(appData.ledgers.length > 0) saveData();
                }
            });
        }

        function initUserSystem() {
            const savedUser = localStorage.getItem('travelAccountingUser');
            if (savedUser) {
                try {
                    currentUser = JSON.parse(savedUser);
                    updateUserUI();
                } catch(e) { currentUser = null; showUserModal(); }
            } else {
                showUserModal();
            }
        }
        function showUserModal() {
            const modal = document.getElementById('userProfileModal');
            const currentInfoDiv = document.getElementById('currentUserInfo');
            const userNameSpan = document.getElementById('currentUserName');
            const userEmailSpan = document.getElementById('currentUserEmail');
            const inputName = document.getElementById('inputUserName');
            const inputEmail = document.getElementById('inputUserEmail');
            const adminBadge = document.getElementById('adminBadgeContainer');
            const title = document.getElementById('userModalTitle');
            
            if (currentUser) {
                currentInfoDiv.classList.remove('hidden');
                userNameSpan.innerText = currentUser.name;
                userEmailSpan.innerText = currentUser.email;
                inputName.value = currentUser.name;
                inputEmail.value = currentUser.email;
                title.innerText = '編輯個人資料';
                if (currentUser.email === APP_ADMIN_EMAIL) {
                    adminBadge.classList.remove('hidden');
                } else {
                    adminBadge.classList.add('hidden');
                }
            } else {
                currentInfoDiv.classList.add('hidden');
                inputName.value = '';
                inputEmail.value = '';
                title.innerText = '登入 / 註冊';
                adminBadge.classList.add('hidden');
            }
            modal.style.display = 'block';
        }
        function handleUserLogin(e) {
            e.preventDefault();
            const name = document.getElementById('inputUserName').value.trim();
            const email = document.getElementById('inputUserEmail').value.trim();
            if (!name || !email) return showToast('請完整輸入名稱與 Email');
            const previousUser = currentUser;
            currentUser = { name, email };
            localStorage.setItem('travelAccountingUser', JSON.stringify(currentUser));
            document.getElementById('userProfileModal').style.display = 'none';
            updateUserUI();
            if (!previousUser || previousUser.email !== email) {
                // 切換使用者時重設當前選擇的帳冊，避免權限問題
                appData.currentLedgerId = null;
                updateUI();
            } else {
                updateUI();
            }
            showToast(`歡迎, ${name}`);
        }
        function updateUserUI() {
            const dot = document.getElementById('userStatusDot');
            if (currentUser) dot.classList.replace('bg-red-400', 'bg-green-500');
            else dot.classList.replace('bg-green-500', 'bg-red-400');
            updateAdminControls();
        }
        function updateAdminControls() {
            const isAdmin = currentUser && currentUser.email === APP_ADMIN_EMAIL;
            document.getElementById('adminControls').classList.toggle('hidden', !isAdmin);
        }

        function checkUrlParams() {
            const urlParams = new URLSearchParams(window.location.search);
            const action = urlParams.get('action');
            const expenseId = urlParams.get('expenseId');
            const ledgerId = urlParams.get('ledgerId');
            if (action === 'edit' && expenseId && ledgerId) {
                appData.currentLedgerId = ledgerId;
                updateUI();
                setTimeout(() => { openExpenseModal(expenseId); }, 500);
                window.history.replaceState({}, document.title, window.location.pathname);
            }
        }

        // ==================== 帳冊設定（完整功能）====================
        function openLedgerModal(ledgerId = null) {
            const modal = document.getElementById('ledgerModal');
            const form = document.getElementById('ledgerForm');
            form.reset();
            selectedMainCatId = null;
            selectedCityId = null;
            
            if (ledgerId) {
                const ledger = appData.ledgers.find(l => l.id === ledgerId);
                if (ledger) {
                    if (ledger.locked && (!currentUser || currentUser.email !== APP_ADMIN_EMAIL)) {
                        showToast('此帳冊已鎖定，無法修改設定');
                        return;
                    }
                    document.getElementById('ledgerModalTitle').innerText = '編輯帳冊設定';
                    document.getElementById('ledgerName').value = ledger.name || '';
                    tempLedger.mainCats = Array.isArray(ledger.categories?.main) ? JSON.parse(JSON.stringify(ledger.categories.main)) : [];
                    tempLedger.subCats = ledger.categories?.sub ? JSON.parse(JSON.stringify(ledger.categories.sub)) : {};
                    tempLedger.cities = Array.isArray(ledger.locations?.cities) ? JSON.parse(JSON.stringify(ledger.locations.cities)) : [];

        function renderList(containerId, items, selectedId, onSelect, onDelete, onEdit, onMoveUp, onMoveDown) {

            container.innerHTML = '';

                const el = document.createElement('div');

                if(onEdit) el.querySelector('.tag-btn-edit')?.addEventListener('click', (e) => { e.stopPropagation(); let newVal = prompt('請輸入新名稱', item.name); if(newVal?.trim()) onEdit(item.id, newVal.trim()); });
                if(onMoveUp) el.querySelector('.tag-btn-up')?.addEventListener('click', (e) => { e.stopPropagation(); onMoveUp(idx); });
                if(onMoveDown) el.querySelector('.tag-btn-down')?.addEventListener('click', (e) => { e.stopPropagation(); onMoveDown(idx); });
                el.querySelector('.tag-btn-delete').addEventListener('click', (e) => { e.stopPropagation(); if(confirm('刪除?')) onDelete(item.id); });
                container.appendChild(el);

        function addMainCat() { let val = document.getElementById('newMainCatInput')?.value.trim(); if(!val) return; let id=Date.now().toString(); tempLedger.mainCats.push({id,name:val}); tempLedger.subCats[id]=[]; document.getElementById('newMainCatInput').value=''; renderLedgerConfigUI(); selectedMainCatId=id; renderLedgerConfigUI(); }

        function addSubCat() { if(!selectedMainCatId) return; let val=document.getElementById('newSubCatInput')?.value.trim(); if(!val) return; if(!tempLedger.subCats[selectedMainCatId]) tempLedger.subCats[selectedMainCatId]=[]; tempLedger.subCats[selectedMainCatId].push({id:Date.now().toString(), name:val}); document.getElementById('newSubCatInput').value=''; renderLedgerConfigUI(); }

        function deleteDistrict(pid,id) { if(tempLedger.districts[pid]) tempLedger.districts[pid]=tempLedger.districts[pid].filter(d=>d.id!==id); renderLedgerConfigUI(); }
        function addMember() { let val=document.getElementById('memberInput')?.value.trim(); if(!val) return; let name=val, email=''; let match=val.match(/(.*)<(.+)>/); if(match){ name=match[1].trim(); email=match[2].trim(); } if(tempLedger.members.some(m=>m.name===name)) return showToast('成員名稱重複'); tempLedger.members.push({name,email}); document.getElementById('memberInput').value=''; renderMembers(); }
        function handleLedgerSubmit(e) {

                }
            };
            document.getElementById('expenseLocation').onchange = () => { if(!skipAutoSummary) refreshSummary(); };
            document.getElementById('expenseDestination').onchange = () => { if(!skipAutoSummary) refreshSummary(); };

            if (ledger.locked && !isAdmin) return showToast('帳冊已鎖定，無法變更');
            const catVal = document.getElementById('expenseCategory').value;
            const locVal = document.getElementById('expenseLocation').value;
            if(!catVal || !locVal) return showToast('請完整選擇科目與地點');
            const splittersDiv = document.getElementById('expenseSplitters');
            const splitters = Array.from(splittersDiv.querySelectorAll('.splitter-chk:checked')).map(c => c.value);
            if(splitters.length===0) return showToast('至少需有一位分攤人員');
            const splitterSettled = {};
            splittersDiv.querySelectorAll('.splitter-chk:checked').forEach(chk => {
                const splitter = chk.value;
                const settleChk = chk.closest('.flex').querySelector('.settle-checkbox');
                splitterSettled[splitter] = settleChk ? settleChk.checked : false;
            });
            // 直接從選項中獲取科目名稱（不依賴 ledger 查找，避免因 ID 遺漏導致未知）
            let categoryName = '', subName = '';
            const catOption = document.getElementById('expenseCategory').options[document.getElementById('expenseCategory').selectedIndex];
            if(catOption && catVal !== '') {
                if(catVal.startsWith('main_')) {
                    categoryName = catOption.textContent;
                } else if(catVal.startsWith('sub_')) {
                    categoryName = catOption.getAttribute('data-main-name') || '';
                    subName = catOption.getAttribute('data-sub-name') || '';
                }
            }
            // 解析出發地名稱
            let cityName = '', districtName = '';
            const locOption = document.getElementById('expenseLocation').options[document.getElementById('expenseLocation').selectedIndex];
            if(locOption && locVal !== '') {
                if(locVal.startsWith('city_')) {
                    cityName = locOption.textContent;
                } else if(locVal.startsWith('district_')) {
                    cityName = locOption.textContent.replace(/^[　↳\s]+/, '');
                }
            }
            // 目的地
            let destinationObj = null;
            const isTransport = categoryName.includes('交通');
            if(isTransport) {
                const destVal = document.getElementById('expenseDestination').value;
                if(destVal) {
                    const destOption = document.getElementById('expenseDestination').options[document.getElementById('expenseDestination').selectedIndex];
                    if(destOption) {
                        let destCityName = '', destDistrictName = '';
                        if(destVal.startsWith('city_')) {
                            destCityName = destOption.textContent;
                        } else if(destVal.startsWith('district_')) {
                            destCityName = destOption.textContent.replace(/^[　↳\s]+/, '');
                        }
                        destinationObj = { city: { id: 'temp', name: destCityName }, district: destDistrictName ? { id: 'temp', name: destDistrictName } : null };
                    }
                }
            }
            const amt = parseFloat(document.getElementById('expenseAmount').value);
            const isTreat = document.getElementById('expenseTreat').checked;
            const expense = {
                id: currentEditingExpenseId || Date.now().toString(),
                ledgerId: appData.currentLedgerId,
                date: document.getElementById('expenseDate').value,
                time: document.getElementById('expenseTime').value,
                description: document.getElementById('expenseDescription').value,
                amount: amt,
                payer: document.getElementById('expensePayer').value,
                splitters: splitters,
                averageAmount: splitters.length>0 && !isTreat ? amt/splitters.length : 0,
                isTreat: isTreat,
                splitterSettled: splitterSettled,
                category: {
                    main: { id: catVal, name: categoryName || '未分類' },
                    sub: subName ? { id: 'sub', name: subName } : null
                },
                location: {
                    city: { id: locVal, name: cityName || '未知地點' },
                    district: districtName ? { id: 'dist', name: districtName } : null
                },
                destination: destinationObj,
                receipt: document.getElementById('receiptImagePreview').src || null
            };
            if(!appData.expenses) appData.expenses = [];
            if(currentEditingExpenseId){
                const idx = appData.expenses.findIndex(e=>e.id===currentEditingExpenseId);
                if(idx>=0) appData.expenses[idx] = expense;
            } else {
                appData.expenses.push(expense);
            }
            saveData();
            renderExpenseList();
            updateLedgerInfoPanel();
            document.getElementById('expenseModal').style.display = 'none';
            showToast('記錄已儲存');
        }
        function renderExpenseList() {
            const list = document.getElementById('expenseList');
            const exps = (appData.expenses||[]).filter(e=>e.ledgerId===appData.currentLedgerId);
            if(!exps.length) { list.innerHTML='<div class="text-center py-12 text-slate-400">尚無支出記錄</div>'; return; }
            exps.sort((a,b)=>new Date(`${b.date} ${b.time}`)-new Date(`${a.date} ${a.time}`));
            list.innerHTML = exps.map(e => {
                const categoryName = e.category?.main?.name || '未知';
                const subName = e.category?.sub?.name || '';
                const displayCat = subName ? `${categoryName} · ${subName}` : categoryName;
                const locationName = e.location?.city?.name || '未知';
                const totalSplitters = e.splitters.length;
                const settledCount = e.splitterSettled ? Object.values(e.splitterSettled).filter(v=>v===true).length : 0;
                const progressBadge = !e.isTreat ? `<span class="text-xs ml-2 ${settledCount===totalSplitters ? 'text-green-600' : 'text-amber-500'}">(${settledCount}/${totalSplitters} 人已付款)</span>` : '';
                return `<div class="bg-white border rounded-xl p-4 shadow-sm card-hover">
                    <div class="flex justify-between">
                        <div>
                            <div class="font-bold">${e.description || ''}</div>
                            <div class="text-xs text-slate-500">${e.date || ''} | ${locationName} | ${displayCat}</div>
                        </div>
                        <div class="text-xl font-bold ${e.isTreat?'text-pink-500':'text-slate-800'}">$${e.amount.toFixed(0)}</div>
                    </div>
                    <div class="flex justify-between items-center mt-2">
                        <div class="text-xs"><span class="font-bold">${e.payer}</span> 付款 | ${e.splitters.length}人分攤 ${progressBadge}</div>
                        <div class="flex gap-2">
                            ${e.receipt ? `<button onclick="viewReceipt('${e.id}')" class="text-slate-400 hover:text-blue-500"><i class="fas fa-image"></i></button>` : ''}
                            <button onclick="openExpenseModal('${e.id}')" class="text-slate-400 hover:text-blue-500"><i class="fas fa-pen"></i> 編輯</button>
                            <button onclick="deleteExpense('${e.id}')" class="text-slate-400 hover:text-red-500"><i class="fas fa-trash"></i></button>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }
        function deleteExpense(id) {
            const ledger = appData.ledgers.find(l=>l.id===appData.currentLedgerId);
            if(ledger.locked && currentUser?.email!==APP_ADMIN_EMAIL) return showToast('帳冊已鎖定，無法刪除');
            if(confirm('確定刪除此筆記錄?')){
                appData.expenses = appData.expenses.filter(e=>e.id!==id);
                saveData();
                renderExpenseList();
                updateLedgerInfoPanel();
                showToast('已刪除');
            }
        }
        function viewReceipt(id){
            const exp = appData.expenses.find(e=>e.id===id);
            if(exp?.receipt){
                document.getElementById('receiptViewImage').src = exp.receipt;
                document.getElementById('receiptViewModal').style.display = 'block';
            }
        }

        function updateLedgerInfoPanel() {
            const l = appData.ledgers.find(x=>x.id===appData.currentLedgerId);
            if(!l) return;
            document.getElementById('displayLedgerName').innerText = l.name;
            const cityCount = (l.locations?.cities || []).length;
            const memberCount = (l.members || []).length;
            document.getElementById('ledgerMetaSummary').innerText = `${cityCount} 個城市 · ${memberCount} 位成員`;
            document.getElementById('ledgerInfo').classList.remove('hidden');
            document.getElementById('ledgerCategories').innerText = (l.categories?.main || []).map(c=>c.name).join('、');
            document.getElementById('ledgerLocations').innerText = (l.locations?.cities || []).map(c=>c.name).join('、');
            document.getElementById('ledgerMembers').innerText = (l.members || []).map(m=>m.name).join('、');
            document.getElementById('lockBadge').classList.toggle('hidden', !l.locked);
            const exps = (appData.expenses||[]).filter(e=>e.ledgerId===appData.currentLedgerId);
            let waived=0, settledSum=0, outstandingSum=0;
            exps.forEach(e=>{
                if(e.isTreat) waived+=e.amount;
                else {
                    if(e.splitterSettled) {
                        const allSettled = Object.values(e.splitterSettled).every(v=>v===true);
                        if(allSettled) settledSum += e.amount;
                        else outstandingSum += e.amount;
                    } else {
                        outstandingSum += e.amount;
                    }
                }
            });
            document.getElementById('statWaived').innerText = waived.toFixed(0);
            document.getElementById('statSettled').innerText = settledSum.toFixed(0);
            document.getElementById('statOutstanding').innerText = outstandingSum.toFixed(0);
            document.getElementById('statTotal').innerText = (waived+settledSum+outstandingSum).toFixed(0);
        }
        function updateUI() {
            const select = document.getElementById('ledgerSelect');
            select.innerHTML = '<option value="">請選擇帳冊</option>';
            const visibleLedgers = appData.ledgers.filter(l => {
                if(!currentUser) return false;
                if(currentUser.email===APP_ADMIN_EMAIL) return true;
                return (l.members || []).some(m=>m.email===currentUser.email);
            });
            visibleLedgers.forEach(l=>select.add(new Option(`${l.name}${l.locked?' (已鎖定)':''}`, l.id)));
            if(appData.currentLedgerId && visibleLedgers.some(l=>l.id===appData.currentLedgerId)){
                select.value = appData.currentLedgerId;
                updateLedgerInfoPanel();
                renderExpenseList();
                document.getElementById('ledgerCollapsible').style.maxHeight = '0px';
                document.getElementById('ledgerCollapsible').style.opacity = '0';
                document.getElementById('ledgerChevron').classList.remove('rotate-180');
                document.getElementById('ledgerMetaSummary').classList.remove('hidden');
                const ledger = appData.ledgers.find(l=>l.id===appData.currentLedgerId);
                const isLocked = ledger && ledger.locked;
                const isAdmin = currentUser?.email === APP_ADMIN_EMAIL;
                document.getElementById('addExpenseBtn').classList.toggle('hidden', isLocked && !isAdmin);
            } else {
                appData.currentLedgerId = null;
                document.getElementById('displayLedgerName').innerText = "請選擇或建立帳冊";
                document.getElementById('ledgerMetaSummary').classList.add('hidden');
                document.getElementById('ledgerInfo').classList.add('hidden');
                document.getElementById('lockBadge').classList.add('hidden');
                document.getElementById('addExpenseBtn').classList.add('hidden');
                document.getElementById('expenseList').innerHTML = '<div class="text-center py-12 text-slate-400">請先選擇帳冊</div>';
            }
            updateAdminControls();
        }
        function showToast(msg){
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.remove('hidden');
            setTimeout(()=>t.classList.add('hidden'),2500);
        }

        function setupEvents() {
            document.getElementById('userForm').onsubmit = handleUserLogin;
            document.getElementById('switchUserBtn').onclick = () => {
                localStorage.removeItem('travelAccountingUser');
                currentUser = null;
                // 清空當前選擇的帳冊，避免權限問題
                appData.currentLedgerId = null;
                updateUI();
                showUserModal();
                showToast('已切換使用者');
            };
            document.getElementById('userBtn').onclick = () => showUserModal();
            document.getElementById('viewStatsBtn').onclick = () => {
                if(!appData.currentLedgerId) return showToast('請先選擇帳冊');
                window.location.href = `view.html?ledgerId=${appData.currentLedgerId}`;
            };
            document.getElementById('addExpenseBtn').onclick = () => openExpenseModal();
            document.getElementById('cancelExpenseBtn').onclick = () => document.getElementById('expenseModal').style.display = 'none';
            document.getElementById('expenseForm').onsubmit = handleExpenseSubmit;
            document.getElementById('ledgerSelect').onchange = (e) => { appData.currentLedgerId = e.target.value; updateUI(); saveData(); };
            document.getElementById('addLedgerBtn').onclick = () => openLedgerModal();
            document.getElementById('editLedgerBtn').onclick = () => { if(appData.currentLedgerId) openLedgerModal(appData.currentLedgerId); else showToast('請先選擇帳冊'); };
            document.getElementById('deleteLedgerBtn').onclick = () => { if(confirm('刪除帳冊？所有相關支出將一併刪除')){ appData.ledgers = appData.ledgers.filter(l=>l.id!==appData.currentLedgerId); appData.expenses = appData.expenses.filter(e=>e.ledgerId!==appData.currentLedgerId); appData.currentLedgerId=null; saveData(); updateUI(); } };
            document.getElementById('toggleLockLedgerBtn').onclick = () => { const l=appData.ledgers.find(l=>l.id===appData.currentLedgerId); if(l){ l.locked=!l.locked; saveData(); updateUI(); showToast(l.locked?'帳冊已鎖定':'帳冊已解鎖'); } };
            document.getElementById('ledgerForm').onsubmit = handleLedgerSubmit;
            document.getElementById('expenseReceipt').onchange = (e) => { const f=e.target.files[0]; if(f){ const r=new FileReader(); r.onload=(ev)=>{ document.getElementById('receiptImagePreview').src=ev.target.result; document.getElementById('receiptPreview').classList.remove('hidden'); }; r.readAsDataURL(f); } };
            document.getElementById('ledgerToggleHeader').onclick = () => { const el=document.getElementById('ledgerCollapsible'); const chevron=document.getElementById('ledgerChevron'); if(el.style.maxHeight==='0px' || !el.style.maxHeight){ el.style.maxHeight='800px'; el.style.opacity='1'; chevron.classList.add('rotate-180'); updateLedgerInfoPanel(); } else { el.style.maxHeight='0px'; el.style.opacity='0'; chevron.classList.remove('rotate-180'); } };
            document.querySelectorAll('.closeModal').forEach(btn => btn.onclick = (e) => { e.target.closest('.modal').style.display = 'none'; });
            window.onclick = (e) => { if(e.target.classList.contains('modal') && e.target.id !== 'expenseModal') e.target.style.display = 'none'; };
            document.getElementById('aboutBtn').onclick = () => { const modal=document.getElementById('aboutModal'); modal.style.display='block'; const url=window.location.href; const container=document.getElementById('qrcodeContainer'); container.innerHTML=''; try{ const qr=qrcode(0,'M'); qr.addData(url); qr.make(); const canvas=document.createElement('canvas'); const size=qr.getModuleCount()*5; canvas.width=size; canvas.height=size; const ctx=canvas.getContext('2d'); for(let r=0;r<qr.getModuleCount();r++) for(let c=0;c<qr.getModuleCount();c++){ ctx.fillStyle=qr.isDark(r,c)?'#000':'#fff'; ctx.fillRect(c*5,r*5,5,5); } container.appendChild(canvas); }catch(e){ container.innerHTML='QR Code 生成失敗'; } };
        }

        document.getElementById('versionTag').innerText = CURRENT_VERSION;
        document.getElementById('aboutVersion').innerText = CURRENT_VERSION;
        loadLocalData();
        initUserSystem();
        setupFirebaseSync();
        setupEvents();
        checkUrlParams();
        updateUI();
    </script>
</body>
</html>
